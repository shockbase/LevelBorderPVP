name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Gradle build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version-file: .java-version

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --refresh-dependencies

      - name: Upload plugin jar
        uses: actions/upload-artifact@v7
        with:
          name: LevelBorderPVP
          path: build/libs/*.jar

      - name: Prepare release jar
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p release
          cp build/libs/*.jar release/LevelBorderPVP.jar

      - name: Read dependency versions
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: versions
        shell: bash
        run: |
          worldborderapi=$(sed -n 's/^val worldBorderApiVersion = "\([^"]*\)"$/\1/p' build.gradle.kts)
          paper=$(./gradlew -q printPaperApiVersion)
          if [ -z "$worldborderapi" ] || [ -z "$paper" ]; then
            echo "WorldBorderAPI version not found in build.gradle.kts" >&2
            exit 1
          fi
          echo "worldborderapi=$worldborderapi" >> "$GITHUB_OUTPUT"
          echo "paper=$paper" >> "$GITHUB_OUTPUT"

      - name: Create WorldBorderAPI version release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.versions.outputs.worldborderapi }}
          PAPER_VERSION: ${{ steps.versions.outputs.paper }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/LevelBorderPVP.jar --clobber
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TAG" --notes "Compatible with WorldBorderAPI $RELEASE_TAG and Paper $PAPER_VERSION. Automatic build from ${{ github.sha }}" --latest
          else
            gh release create "$RELEASE_TAG" release/LevelBorderPVP.jar --target "${{ github.sha }}" --title "$RELEASE_TAG" --notes "Compatible with WorldBorderAPI $RELEASE_TAG and Paper $PAPER_VERSION. Automatic build from ${{ github.sha }}" --latest
          fi
