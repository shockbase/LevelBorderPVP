name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Gradle build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version-file: .java-version

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: Upload plugin jar
        uses: actions/upload-artifact@v7
        with:
          name: LevelBorderPVP
          path: build/libs/*.jar

      - name: Prepare release jar
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p release
          cp build/libs/*.jar release/LevelBorderPVP.jar

      - name: Read WorldBorderAPI version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: worldborderapi
        shell: bash
        run: |
          version=$(sed -n 's/^val worldBorderApiVersion = "\([^"]*\)"$/\1/p' build.gradle.kts)
          if [ -z "$version" ]; then
            echo "WorldBorderAPI version not found in build.gradle.kts" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create WorldBorderAPI version release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.worldborderapi.outputs.version }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/LevelBorderPVP.jar --clobber
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TAG" --notes "Compatible with WorldBorderAPI $RELEASE_TAG. Automatic build from ${{ github.sha }}" --latest
          else
            gh release create "$RELEASE_TAG" release/LevelBorderPVP.jar --target "${{ github.sha }}" --title "$RELEASE_TAG" --notes "Compatible with WorldBorderAPI $RELEASE_TAG. Automatic build from ${{ github.sha }}" --latest
          fi
